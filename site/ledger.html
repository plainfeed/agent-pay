<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@36.2.0/dist/ag-grid-community.min.js"></script>
<style>
:root{--bg:#f6f5f1;--panel:#ffffff;--ink:#1b1d1f;--muted:#5d6166;--line:#dcdad3;--accent:#0b6b55;--good:#0b6b55;--bad:#a1281e;--chip:#ebe9e2;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"B612 Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141516;--panel:#1d1f21;--ink:#ecebe6;--muted:#a3a7ab;--line:#33363a;--accent:#3fbf98;--good:#3fbf98;--bad:#ff8a7d;--chip:#2a2d30}}
:root[data-theme="dark"]{--bg:#141516;--panel:#1d1f21;--ink:#ecebe6;--muted:#a3a7ab;--line:#33363a;--accent:#3fbf98;--good:#3fbf98;--bad:#ff8a7d;--chip:#2a2d30}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
main{max-width:1200px;margin:0 auto;padding:24px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:16px}
h1{font-size:22px;margin:0}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--muted)}
.chain{font-size:14px}.chain.ok{color:var(--good)}.chain.bad{color:var(--bad);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .k{font-size:13px;color:var(--muted)}.tile .v{font:700 22px var(--sans);font-variant-numeric:tabular-nums}
#grid{height:62vh;min-height:360px}
p.note{color:var(--muted);font-size:13px;margin:12px 0 0}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<header>
  <h1>Payment ledger</h1>
  <span class="chip" id="mode">loading</span>
  <span class="chain" id="chain"></span>
</header>
<section class="tiles" aria-label="Totals">
  <div class="tile"><div class="k">Captured</div><div class="v" id="t-captured">$0.00</div></div>
  <div class="tile"><div class="k">Refunded</div><div class="v" id="t-refunded">$0.00</div></div>
  <div class="tile"><div class="k">Net</div><div class="v" id="t-net">$0.00</div></div>
  <div class="tile"><div class="k">Entries</div><div class="v" id="t-entries">0</div></div>
</section>
<div id="grid"></div>
<p class="note">Every line holds the SHA-256 hash of the line before it. Changing or deleting any past line breaks the chain from that point, and the check above turns red. Updates every 3 seconds. <a href="/">Back</a></p>
</main>
<script>
const LABELS = { order_created: 'Waiting for approval', payment_captured: 'Paid', capture_pending: 'On hold', paypal_confirmed: 'PayPal confirmed', payment_declined: 'Declined', cap_blocked: 'Blocked by limit', cancelled: 'Cancelled', refunded: 'Refunded', mismatch: 'Held for review' };
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dark = matchMedia('(prefers-color-scheme: dark)');
function theme() {
  return agGrid.themeQuartz.withPart(dark.matches ? agGrid.colorSchemeDark : agGrid.colorSchemeLight).withParams({
    fontFamily: css('--sans'), headerFontFamily: css('--sans'), backgroundColor: css('--panel'), foregroundColor: css('--ink'),
    accentColor: css('--accent'), borderColor: css('--line'), headerBackgroundColor: css('--bg'), wrapperBorderRadius: 10,
  });
}
const mono = { fontFamily: 'var(--mono)', fontSize: '13px' };
const nums = { fontVariantNumeric: 'tabular-nums' };
agGrid.ModuleRegistry.registerModules([agGrid.AllCommunityModule]);
const api = agGrid.createGrid(document.getElementById('grid'), {
  theme: theme(),
  rowData: [],
  getRowId: (p) => String(p.data.seq),
  columnDefs: [
    { field: 'seq', headerName: '#', width: 64, sort: 'desc', cellStyle: nums },
    { field: 'text', headerName: 'What happened', flex: 1, minWidth: 280, wrapText: true, autoHeight: true, cellStyle: { lineHeight: '1.45', paddingTop: '8px', paddingBottom: '8px' } },
    { field: 'type', headerName: 'Event', width: 150, valueFormatter: (p) => LABELS[p.value] || p.value, filter: true },
    { field: 'amount', headerName: 'Amount', width: 96, type: 'rightAligned', valueFormatter: (p) => (p.value ? '$' + p.value : ''), cellStyle: nums },
    { field: 'agent_name', headerName: 'Agent', colId: 'agent', width: 170, filter: true },
    { field: 'at', headerName: 'Time (UTC)', colId: 'time', width: 170, valueFormatter: (p) => (p.value || '').replace('T', ' ').slice(0, 19), cellStyle: nums },
    { field: 'paypal_order_id', headerName: 'PayPal order', colId: 'order', width: 190, cellStyle: mono },
  ],
  defaultColDef: { resizable: true, sortable: true },
});
dark.addEventListener('change', () => api.setGridOption('theme', theme()));
// On narrow screens keep the plain-English line, the event and the amount; hide the rest.
const narrow = matchMedia('(max-width: 760px)');
const fit = () => api.setColumnsVisible(['agent', 'time', 'order'], !narrow.matches);
narrow.addEventListener('change', fit);
fit();
async function load() {
  try {
    const r = await fetch('/ledger.json', { cache: 'no-store' });
    const d = await r.json();
    document.getElementById('mode').textContent = d.paypal === 'mock' ? 'Mock PayPal (no account)' : 'PayPal sandbox';
    const c = document.getElementById('chain');
    c.className = 'chain ' + (d.check.ok ? 'ok' : 'bad');
    c.textContent = d.check.ok ? `Chain check passed: ${d.check.entries} entries, nothing changed or removed` : `Chain broken at entry ${d.check.broken_at}: ${d.check.reason}`;
    for (const k of ['captured', 'refunded', 'net']) document.getElementById('t-' + k).textContent = '$' + d.totals[k];
    document.getElementById('t-entries').textContent = d.totals.entries;
    api.setGridOption('rowData', d.entries);
  } catch (e) {
    document.getElementById('chain').textContent = 'Could not load the ledger.';
  }
}
load();
setInterval(load, 3000);
</script>
</body>
</html>
